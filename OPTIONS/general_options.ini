[file_path]
sat_source_dir: input_path,None
sat_source_dir_organization: str,YYYYjjj
output_dir: output_path,None
overwrite: boolean,False
wce: str,*
unzip_dir: output_path,None

[satellite_options]
satellite: str,None
platform: str,None
sensor: str,None
res: str,None
aco_processor: str, None
proc_version: str, None
cmems_region: str, None, MED;BLK;BAL;GLO;ATL;IBI;NWS
extract_size: int, 25
satellite_time: str, 11:00

[mdb_options]
required: extract_dir, output_dir
extract_dir: input_path,None
ninsitu_max: int,50
time_diff_match_up: float,180
time_diff_temporal_variability: float, 180
output_dir: output_path,None
instrument_ids: strlist, N/A

[multiprocessing]
ncores: int,0
use_slurm_sh: boolean,False
slurm_sh_max_cores:int,8
slurm_sh_launch:boolean,True
sbatch_partition:str,"octac_rep"
sbatch_email:str,None
sbatch_email_type_param:str,"BEGIN,END,FAIL"
conda_source:str,"load_miniconda3.source"
conda_env: str,"op_proc_202211v2"


