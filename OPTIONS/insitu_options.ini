[GLOBAL]
type_list: SINGLE_CSV, MULTIPLE_CSV, SINGLE_SEABASS

[MULTIPLE_CSV]
required: path_csv
path_csv: input_path,None
col_date: str,"date"
col_lat: str,"lat"
col_lon: str,"lon"
col_sep: str,";"
format_date: str,"%%Y-%%m-%%d %%H:%%M:%%S.%%f"
col_time: str,None
format_time: str,"%%H:%%M:%%S"

[SINGLE_CSV]
required: path_csv
path_csv: file,None
col_date: str,"date"
col_lat: str,"lat"
col_lon: str,"lon"
col_sep: str,";"
format_date: str,"%%Y-%%m-%%d %%H:%%M:%%S.%%f"
col_time: str,None
format_time: str,"%%H:%%M:%%S"

[SINGLE_SEABASS]
required: path_seabass
path_seabass: file,None
var_lat: str,"lat"
var_lon: str,"lon"
var_date: str,"date"
format_date: str,"%%Y%%m%%d"
var_time: str,"time"
format_time: str,"%%H:%%M:%%S"
