[GLOBAL]
type_list: SINGLE_CSV, MULTIPLE_CSV, SINGLE_SEABASS, HYPSTAR_L2, SO_RAD

[MULTIPLE_CSV]
required: path_csv
path_csv: input_path,None
col_date: str,"date"
col_lat: str,"lat"
col_lon: str,"lon"
col_sep: str,";"
format_date: str,"%%Y-%%m-%%d %%H:%%M:%%S.%%f"
col_time: str,None
format_time: str,"%%H:%%M:%%S"
site: str, None

[SINGLE_CSV]
required: path_csv
path_csv: file,None
col_date: str,"date"
col_lat: str,"lat"
col_lon: str,"lon"
col_sep: str,";"
format_date: str,"%%Y-%%m-%%d %%H:%%M:%%S.%%f"
col_time: str,None
format_time: str,"%%H:%%M:%%S"
site: str, None
non_spectral_variables: strlist,None

[SINGLE_SEABASS]
required: path_seabass
path_seabass: file,None
var_lat: str,"lat"
var_lon: str,"lon"
var_date: str,"date"
format_date: str,"%%Y%%m%%d"
var_time: str,"time"
format_time: str,"%%H:%%M:%%S"
site: str, None
rrs_format: str,None
rrs_list: strlist,None
rrs_bandlist: strlist,None
rrs_unc_format: str,None
rrs_unc_bandlist:strlist,None
other_spectral_variables: strlist,None
non_spectral_variables: strlist,None

[HYPSTAR_L2]
required: path_hypstar,site
path_hypstar: input_path,None
site: str,None
tag: str,L2A_REF
version: str,None

[SO_RAD]
required: path_sorad
path_sorad: input_path,None
platform_id: str, PML_SR015
site: str, GAIA_BLUE
rrs_algorithm: str, 3c, "3c,fp"
non_spectral_variables: strlist,"rel_view_az,gps_speed,tilt_avg,tilt_std,c3_rmsd,c3_rho_ds,c3_rho_dd,c3_rho_s"
builder_minimum_qc: int,-1,"-1,0,1,2,3"
q0_params: floatlist, "110,150,5,2"
q1_params: floatlist, "0.025,500,1"
q2_params: floatlist, "0.1,1.5"
q3_params: floatlist, "3,0.5,0.1,0.0" 

