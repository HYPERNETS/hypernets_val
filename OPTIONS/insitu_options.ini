[GLOBAL]
type_list: SINGLE_CSV, MULTIPLE_CSV, SINGLE_SEABASS, HYPSTAR_L2

[MULTIPLE_CSV]
required: path_csv
path_csv: input_path,None
col_date: str,"date"
col_lat: str,"lat"
col_lon: str,"lon"
col_sep: str,";"
format_date: str,"%%Y-%%m-%%d %%H:%%M:%%S.%%f"
col_time: str,None
format_time: str,"%%H:%%M:%%S"
site: str, None

[SINGLE_CSV]
required: path_csv
path_csv: file,None
col_date: str,"date"
col_lat: str,"lat"
col_lon: str,"lon"
col_sep: str,";"
format_date: str,"%%Y-%%m-%%d %%H:%%M:%%S.%%f"
col_time: str,None
format_time: str,"%%H:%%M:%%S"
site: str, None

[SINGLE_SEABASS]
required: path_seabass
path_seabass: file,None
var_lat: str,"lat"
var_lon: str,"lon"
var_date: str,"date"
format_date: str,"%%Y%%m%%d"
var_time: str,"time"
format_time: str,"%%H:%%M:%%S"
site: str, None
rrs_format: str,None
rrs_list: strlist,None
rrs_bandlist: strlist,None
rrs_unc_format: str,None
rrs_unc_bandlist:strlist,None
other_spectral_variables: strlist,None
non_spectral_variables: strlist,None

[HYPSTAR_L2]
required: path_hypstar,site
path_hypstar: input_path,None
site: str,None
tag: str,L2A_REF
version: str,None

