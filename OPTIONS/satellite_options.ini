[GLOBAL]
type_list: CNR, CMEMS, OCI, OLCI

[CNR]
required: dataset_name_file, dataset_var_list
dataset_name_file: str,None
dataset_name_format_date: strlist,"%%Y%%j"
dataset_var_list: strlist,None
dataset_var_list_out: strlist,None
otherfiles_var_list: strlist,None
lat_dim: str,lat
lon_dim: str,lon
time_dim: str,time

[CMEMS]
required: dataset_name_file
dataset_name_file: str,None
dataset_name_format_date: strlist,"%%Y%%m%%d"
is_utm: boolean, False
rrs_format: str,RRS$BAND$
rrs_unc_format: str,RRS$BAND$_UNC
rrs_var_list: strlist,None
spectral_var_list: strlist,None
nospectral_var_list: strlist,None
otherfiles_var_list: strlist,None
lat_dim: str,lat
lon_dim: str,lon
time_dim: str,time


[OCI]
version: str,V3_0
timeliness: str,DT,"DT,NRT,ANY"
main_file_tag: str,OC_AOP,"OC_AOP,OC_IOP,OC_BGC"
other_main_variables: str, "geophysical_data: angstrom,aot_865,avw"
geo_file: str,None
geo_file_date_format: str,"%%Y%%m%%dT%%H%%M%%S"

[OLCI]
platform: str, S3A, "S3A,S3B"
collection: str, 003, "003,004"
timeliness: str,NT,"NT,NR,ANY"
tag_res:str, WFR, "WFR, EFR, WRR, ERR"
other_variables: str,"w_aer:*,wqsf:*,chl_nn:*,chl_oc4me:*,iop_nn:*,trsp:*,tsm_nn:*,par:*"

