[GLOBAL]
type_algo: str,None,"expression,common_mu,subset,var_operations,brdf,bal_chl,mbr_chl"

[expression]
required_args: input_path: input_file_nc
expression_: str,None
output_variable:str,None

[common_mu]
required_args: input_path: input_file_nc
output_variable: str,None
output_mode: str,only_variable,"only_variable,subset_file"
flag_among: str,flag_ac
flag_among_values: strlist,None
reference: str,sat_time,"sat_time,sat_date,sat_time_lat_lon,sat_date_lat_lon"
create_mu_variable: boolean,False
mu_valid_variable: str,None

[subset]
required_args: input_path: input_file_nc, output: output_file_nc
type_subset: str,basic_filter,"basic_filter,date_list,satellite_bands"
basic_filter: str,None
date_list_file: file,None
satellite_bands_option: str,band_list,"band_list,file_nc"
band_list: floatlist,None
file_band_list: file,None
variable_band_list:str,satellite_bands

[var_operations]
required_args: input_path: input_file_nc, output: output_file_nc
point_args: vars_to_create, vars_to_copy
vars_to_remove: strlist,None
vars_to_create: strlist,None
vars_to_copy: strlist,None
vars_to_create.dimensions: strlist,None
vars_to_copy.from_file: file,None

[brdf]
required_args: input_path: input_file_nc
output_variable: str,None
brdf_model: str,O25,"Morel,O25"
wl_var: str, None
rrs_var: str, None
sza_var: str, None
vza_var: str, None
raa_var: str, None
vaa_var: str, None
saa_var: str, None

[bal_chl]
required_args: input_path: input_file_nc
version: str,202411,"202211,202411,BOTH"

[mbr_chl]
required_args: input_path: input_file_nc
mbr_algo: strlist,"OC4_MERIS"
satellite_var_name: str,None
create_mu_variable: boolean,False
mu_var_name: str,None
mu_var_ref: str,None
mu_var_method:strlist,"median,3"
overwrite_vars: boolean,False
